<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscriptions — PulseMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="subscriptions">
  <div class="app-layout">
    <div id="sidebarRoot"></div>
    <div id="headerRoot"></div>
    <main class="app-content page-fade-in">
      <div class="sub-container">
        <div class="page-title-bar" style="padding: 0 0 24px">
          <h1>Subscription Tracker</h1>
        </div>

        <div class="sub-stats" id="subStats"></div>

        <div class="sub-filters">
          <div class="sub-filter-tabs" id="subFilterTabs">
            <button class="sub-filter-tab active" data-filter="all">All</button>
            <button class="sub-filter-tab" data-filter="active">Active</button>
            <button class="sub-filter-tab" data-filter="muted">Muted</button>
            <button class="sub-filter-tab" data-filter="unsubscribed">Unsubscribed</button>
          </div>
        </div>

        <div class="sub-list" id="subList">
          <div class="skeleton-list">
            <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-content"><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--long"></div></div><div class="skeleton-line skeleton-line--date"></div></div>
            <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-content"><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--long"></div></div><div class="skeleton-line skeleton-line--date"></div></div>
            <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-content"><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--long"></div></div><div class="skeleton-line skeleton-line--date"></div></div>
            <div class="skeleton-item"><div class="skeleton-circle"></div><div class="skeleton-content"><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--long"></div></div><div class="skeleton-line skeleton-line--date"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/gmail-api.js"></script>
  <script src="../assets/js/mail-service.js"></script>
  <script src="../assets/js/services/subscription-service.js"></script>
  <script src="../assets/js/services/reminder-service.js"></script>
  <script src="../assets/js/services/focus-mode-service.js"></script>
  <script src="../assets/js/components/sidebar.js"></script>
  <script src="../assets/js/components/header.js"></script>
  <script src="../assets/js/components/email-list.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/pages/subscriptions.js"></script>
</body>
</html>
