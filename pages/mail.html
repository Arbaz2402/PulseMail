<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email — PulseMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-page="inbox">
  <div class="app-layout">
    <div id="sidebarRoot"></div>
    <div id="headerRoot"></div>
    <main class="app-content page-fade-in">
      <div class="mail-view-container">
        <div class="mail-view" id="mailView">
          <div class="skeleton-list" style="padding: var(--space-6);">
            <div class="skeleton-item" style="border:none;padding:0 0 var(--space-4)"><div class="skeleton-line" style="width:60%;height:20px"></div></div>
            <div class="skeleton-item" style="border:none;padding:var(--space-3) 0"><div class="skeleton-circle"></div><div class="skeleton-content"><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line" style="width:45%"></div></div></div>
            <div style="padding-top:var(--space-6);display:flex;flex-direction:column;gap:10px"><div class="skeleton-line skeleton-line--long"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:50%"></div><div class="skeleton-line skeleton-line--long"></div><div class="skeleton-line" style="width:75%"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/gmail-api.js"></script>
  <script src="../assets/js/mail-service.js"></script>
  <script src="../assets/js/services/reminder-service.js"></script>
  <script src="../assets/js/services/summarizer-service.js"></script>
  <script src="../assets/js/services/smart-reply-service.js"></script>
  <script src="../assets/js/services/focus-mode-service.js"></script>
  <script src="../assets/js/components/sidebar.js"></script>
  <script src="../assets/js/components/header.js"></script>
  <script src="../assets/js/components/email-list.js"></script>
  <script src="../assets/js/components/toast.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/pages/mail.js"></script>
</body>
</html>
